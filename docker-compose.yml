services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - php
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app:/app
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /bin/sh /entrypoint.sh

  php:
    build:
      context: .
      dockerfile: PHP.Dockerfile
    environment:
      # Used by Stripe return URLs; set STRIPE_SECRET_KEY for real test payments (see README).
      APP_PUBLIC_URL: http://localhost
      # Email (PHPMailer SMTP). Defaults point at the local Mailpit catcher — no account needed.
      # Override MAIL_* in a root .env to use real SMTP (e.g. Gmail) instead.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@haarlem-festival.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Haarlem Festival}
    volumes:
      - ./app:/app
      # Overrides default 2M/8M limits without rebuilding the image (discography audio uploads).
      - ./docker/php/conf.d/zz-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro

  mysql:
      image: mariadb:latest
      environment:
        MYSQL_ROOT_PASSWORD: secret123
        MYSQL_DATABASE: HaarlemFestivaldb
        MYSQL_USER: developer
        MYSQL_PASSWORD: secret123
      ports:
        - "3307:3306"
      volumes:
        - mysqldata:/var/lib/mysql
        - ./docker/mysql/init:/docker-entrypoint-initdb.d


  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

  # Local mail catcher: SMTP on 1025, web inbox on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  mysqldata:
